<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="popupTitle">OPAL Redesign</title>
<link rel="stylesheet" href="../styles/page.css">
<link rel="stylesheet" href="../styles/components.css">
<link rel="stylesheet" href="popup.css">
</head>
<body hidden>
<header class="popup-head">
<h1 data-i18n="popupTitle">OPAL Redesign</h1>
<label class="opal-switch"><input id="toggleEnabled" type="checkbox" role="switch" aria-label="OPAL Redesign verwenden" data-i18n-aria-label="pagesEnabled"><span class="opal-switch-track" aria-hidden="true"></span><span class="opal-switch-thumb" aria-hidden="true"></span></label>
</header>
<p class="popup-note" id="toggleNote" role="status" aria-live="polite"></p>
<label class="popup-label" for="search" data-i18n="popupSearch">Kurse und Dateien suchen</label>
<input type="search" id="search" placeholder="z. B. Übung 3" data-i18n-placeholder="popupPlaceholder" autocomplete="off">
<p class="popup-heading" id="resultsHeading" hidden></p>
<div id="results" aria-live="polite" aria-labelledby="resultsHeading"></div>
<footer class="popup-foot">
<button type="button" class="opal-btn" id="openOptions" data-i18n="popupSettings">Einstellungen…</button>
<span class="popup-version"><span data-i18n="pagesVersion">Version</span> <span id="version"></span></span>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
